<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="700" viewBox="0 -90 800 700" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'JetBrains Mono', monospace; }
    .comp { fill: #fff; stroke: #333; stroke-width: 1.5; }
    .ext { fill: #f0f8ff; stroke: #0099cc; stroke-width: 1.5; }
    .out-box { fill: #fff8f0; stroke: #cc8800; stroke-width: 1.5; }
    .fb-box { fill: #fff0f0; stroke: #cc2222; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#333"/>
    </marker>
    <marker id="arr-a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#cc8800"/>
    </marker>
    <marker id="arr-b" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#0099cc"/>
    </marker>
    <marker id="arr-g" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#009977"/>
    </marker>
    <marker id="arr-r" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#cc2222"/>
    </marker>
  </defs>

  <!-- EX/MEM register (input, left) -->
  <rect x="10" y="30" width="20" height="520" rx="2" fill="#e8e8e8" stroke="#666" stroke-width="1"/>
  <text x="20" y="290" text-anchor="middle" font-size="8" fill="#666" transform="rotate(-90 20 290)">EX / MEM</text>

  <!-- Stage background -->
  <rect x="50" y="30" width="540" height="520" rx="8" fill="#e0ffe0" fill-opacity="0.12" stroke="#009900" stroke-width="2"/>
  <text x="320" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#009900">MEMORY ACCESS (MA)</text>

  <!-- MEM/WB register (output, right) -->
  <rect x="610" y="30" width="20" height="520" rx="2" fill="#e8e8e8" stroke="#666" stroke-width="1"/>
  <text x="620" y="290" text-anchor="middle" font-size="8" fill="#666" transform="rotate(-90 620 290)">MEM / WB</text>

  <!-- ═══ LEFT: Inputs from EX/MEM ═══ -->

  <line x1="30" y1="55" x2="70" y2="55" stroke="#009977" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="35" y="48" font-size="7" fill="#009977">pc [31:0]</text>

  <line x1="30" y1="85" x2="70" y2="85" stroke="#cc8800" stroke-width="1.5" marker-end="url(#arr-a)"/>
  <text x="35" y="78" font-size="7" fill="#cc8800">alu_result [31:0]</text>
  <text x="35" y="92" font-size="6" fill="#888">(mem address)</text>

  <line x1="30" y1="120" x2="70" y2="120" stroke="#cc8800" stroke-width="1.5" marker-end="url(#arr-a)"/>
  <text x="35" y="113" font-size="7" fill="#cc8800">rs2_val [31:0]</text>
  <text x="35" y="127" font-size="6" fill="#888">(store data)</text>

  <line x1="30" y1="160" x2="70" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="35" y="153" font-size="7" fill="#333">rd_addr [4:0]</text>

  <line x1="30" y1="190" x2="70" y2="190" stroke="#cc8800" stroke-width="1.5" marker-end="url(#arr-a)"/>
  <text x="35" y="183" font-size="7" fill="#cc8800">rd_val [31:0]</text>

  <line x1="30" y1="220" x2="70" y2="220" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="35" y="213" font-size="7" fill="#333">wr_rd</text>

  <line x1="30" y1="250" x2="70" y2="250" stroke="#cc2222" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="35" y="243" font-size="7" fill="#cc2222">opcode [10:0]</text>

  <line x1="30" y1="280" x2="70" y2="280" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="35" y="273" font-size="7" fill="#333">funct3 [2:0]</text>

  <line x1="30" y1="310" x2="70" y2="310" stroke="#cc8800" stroke-width="1.5" marker-end="url(#arr-a)"/>
  <text x="35" y="303" font-size="7" fill="#cc8800">rs1_val [31:0]</text>
  <text x="35" y="317" font-size="6" fill="#888">(CSR write)</text>

  <line x1="30" y1="345" x2="70" y2="345" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="35" y="338" font-size="7" fill="#333">imm [11:0]</text>
  <text x="35" y="352" font-size="6" fill="#888">(CSR addr)</text>

  <line x1="30" y1="380" x2="70" y2="380" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="35" y="373" font-size="7" fill="#333">exception [3:0]</text>

  <!-- ═══ CENTER: Components ═══ -->

  <!-- Store Data Aligner -->
  <rect x="100" y="50" width="160" height="55" rx="3" class="comp"/>
  <text x="180" y="73" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Store Aligner</text>
  <text x="180" y="90" text-anchor="middle" font-size="7" fill="#888">rs2 → byte/half/word aligned</text>
  <text x="180" y="100" text-anchor="middle" font-size="7" fill="#888">+ byte select mask [3:0]</text>

  <!-- alu_result → Store Aligner (address for alignment) -->
  <path d="M 70,85 L 85,85 L 85,65 L 100,65" fill="none" stroke="#cc8800" stroke-width="1" marker-end="url(#arr-a)"/>
  <!-- rs2 → Store Aligner -->
  <path d="M 70,120 L 85,120 L 85,80 L 100,80" fill="none" stroke="#cc8800" stroke-width="1" marker-end="url(#arr-a)"/>
  <!-- funct3 → Store Aligner -->
  <path d="M 70,280 L 88,280 L 88,95 L 100,95" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Memory Bus Interface -->
  <rect x="100" y="130" width="160" height="80" rx="3" class="comp"/>
  <text x="180" y="153" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Memory Bus</text>
  <text x="180" y="170" text-anchor="middle" font-size="7" fill="#888">addr, data_out, we</text>
  <text x="180" y="183" text-anchor="middle" font-size="7" fill="#888">sel, stb, cyc</text>
  <text x="180" y="196" text-anchor="middle" font-size="7" fill="#888">← data_in, ack, stall</text>

  <!-- Store Aligner → Memory Bus -->
  <line x1="180" y1="105" x2="180" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- alu_result (address) → Memory Bus -->
  <path d="M 85,85 L 85,145 L 100,145" fill="none" stroke="#cc8800" stroke-width="1" marker-end="url(#arr-a)"/>

  <!-- Load Data Extractor -->
  <rect x="100" y="235" width="160" height="55" rx="3" class="comp"/>
  <text x="180" y="258" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Load Extractor</text>
  <text x="180" y="275" text-anchor="middle" font-size="7" fill="#888">byte/half/word → sign/zero ext</text>
  <text x="180" y="285" text-anchor="middle" font-size="7" fill="#888">based on funct3 + addr[1:0]</text>

  <!-- Memory Bus → Load Extractor -->
  <line x1="180" y1="210" x2="180" y2="235" stroke="#0099cc" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <text x="188" y="225" font-size="6" fill="#0099cc">data_in</text>

  <!-- funct3 → Load Extractor -->
  <path d="M 88,280 L 88,265 L 100,265" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- ═══ External: RAM / I/O (above stage) ═══ -->
  <rect x="150" y="-70" width="200" height="70" rx="3" class="ext"/>
  <text x="210" y="-45" text-anchor="middle" font-size="11" font-weight="bold" fill="#0099cc">RAM</text>
  <text x="210" y="-28" text-anchor="middle" font-size="8" fill="#0099cc">Data Memory</text>
  <text x="310" y="-45" text-anchor="middle" font-size="11" font-weight="bold" fill="#0099cc">I/O</text>
  <text x="310" y="-28" text-anchor="middle" font-size="8" fill="#0099cc">Peripherals</text>

  <!-- Memory Bus → RAM/IO (up: addr, data, control) -->
  <path d="M 180,130 L 180,0 L 220,0" fill="none" stroke="#0099cc" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="140" y="15" font-size="7" fill="#0099cc">addr, data</text>
  <text x="140" y="28" font-size="7" fill="#0099cc">we, sel, stb</text>

  <!-- RAM/IO → Memory Bus (down: read data, ack) -->
  <path d="M 300,0 L 300,130 L 260,130" fill="none" stroke="#0099cc" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="308" y="15" font-size="7" fill="#0099cc">data, ack</text>

  <!-- ═══ CSR Unit (parallel to memory) ═══ -->
  <rect x="100" y="320" width="160" height="65" rx="3" fill="#fff" stroke="#009977" stroke-width="2"/>
  <text x="180" y="345" text-anchor="middle" font-size="10" font-weight="bold" fill="#009977">CSR Unit</text>
  <text x="180" y="362" text-anchor="middle" font-size="7" fill="#009977">read/write CSRs</text>
  <text x="180" y="375" text-anchor="middle" font-size="7" fill="#009977">cycle, instret, mstatus...</text>

  <!-- rs1_val → CSR (write value) -->
  <path d="M 70,310 L 85,310 L 85,340 L 100,340" fill="none" stroke="#cc8800" stroke-width="1" marker-end="url(#arr-a)"/>
  <!-- imm[11:0] → CSR (address) -->
  <path d="M 70,345 L 82,345 L 82,355 L 100,355" fill="none" stroke="#333" stroke-width="1" marker-end="url(#arr)"/>
  <!-- opcode → CSR (operation type) -->
  <path d="M 70,250 L 92,250 L 92,365 L 100,365" fill="none" stroke="#cc2222" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- External interrupts → CSR -->
  <line x1="180" y1="420" x2="180" y2="385" stroke="#cc2222" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>
  <text x="180" y="435" text-anchor="middle" font-size="7" fill="#cc2222">interrupts</text>
  <text x="180" y="448" text-anchor="middle" font-size="7" fill="#cc2222">(ext, sw, timer)</text>

  <!-- ═══ RIGHT: Outputs to MEM/WB ═══ -->

  <rect x="490" y="45" width="105" height="230" rx="5" class="out-box"/>
  <text x="542" y="63" text-anchor="middle" font-size="9" font-weight="bold" fill="#cc8800">→ MEM/WB</text>
  <text x="500" y="83" font-size="7" fill="#333">pc [31:0]</text>
  <text x="500" y="98" font-size="7" fill="#333">rd_addr [4:0]</text>
  <text x="500" y="113" font-size="7" fill="#333">rd_val [31:0]</text>
  <text x="500" y="128" font-size="7" fill="#888">(ALU result, passthru)</text>
  <text x="500" y="148" font-size="7" fill="#333">wr_rd</text>
  <text x="500" y="168" font-size="7" fill="#0099cc" font-weight="bold">data_load [31:0]</text>
  <text x="500" y="183" font-size="7" fill="#888">(from memory, extended)</text>
  <text x="500" y="203" font-size="7" fill="#009977" font-weight="bold">csr_out [31:0]</text>
  <text x="500" y="218" font-size="7" fill="#888">(CSR read value)</text>
  <text x="500" y="238" font-size="7" fill="#333">opcode [10:0]</text>
  <text x="500" y="253" font-size="7" fill="#333">funct3 [2:0]</text>
  <text x="500" y="268" font-size="7" fill="#333">exception [3:0]</text>

  <!-- Load Extractor → data_load output -->
  <path d="M 260,260 L 475,260 L 475,168 L 490,168" fill="none" stroke="#0099cc" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <!-- CSR → csr_out output -->
  <path d="M 260,350 L 470,350 L 470,203 L 490,203" fill="none" stroke="#009977" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Passthrough: pc, rd_addr, rd_val, wr_rd, opcode, funct3 -->
  <path d="M 70,55 L 90,55 L 90,45 L 475,45 L 475,83 L 490,83" fill="none" stroke="#009977" stroke-width="1" stroke-dasharray="3,2"/>
  <path d="M 70,160 L 93,160 L 93,50 L 478,50 L 478,98 L 490,98" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="3,2"/>
  <path d="M 70,190 L 96,190 L 96,53 L 481,53 L 481,113 L 490,113" fill="none" stroke="#cc8800" stroke-width="1" stroke-dasharray="3,2"/>
  <path d="M 70,220 L 99,220 L 99,56 L 484,56 L 484,148 L 490,148" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Output to MEM/WB -->
  <line x1="595" y1="160" x2="610" y2="160" stroke="#cc8800" stroke-width="1.5" marker-end="url(#arr-a)"/>

  <!-- → FWD (to ID forwarding unit) -->
  <rect x="490" y="300" width="105" height="60" rx="5" class="fb-box"/>
  <text x="542" y="318" text-anchor="middle" font-size="9" font-weight="bold" fill="#cc2222">→ FWD (to ID)</text>
  <text x="500" y="338" font-size="7" fill="#333">rd_addr, wr_rd</text>
  <text x="500" y="353" font-size="7" fill="#333">rd_val [31:0]</text>

  <!-- Pipeline control -->
  <rect x="490" y="380" width="105" height="55" rx="3" fill="#f0f0f0" stroke="#666" stroke-width="1"/>
  <text x="542" y="398" text-anchor="middle" font-size="8" font-weight="bold" fill="#666">Pipeline Ctrl</text>
  <text x="500" y="415" font-size="7" fill="#666">stall_mem</text>
  <text x="500" y="428" font-size="7" fill="#666">flush</text>
  <text x="500" y="441" font-size="6" fill="#888">(stall on mem wait)</text>

</svg>
