[workspace]
members = ["rv-isa", "rv-asm", "sim"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# The cores do not need the disassembly of C / F / H / V (rv-isa feature
# `disasm-ext`, on in rv-isa's own build and tests).
rv-isa             = { path = "rv-isa", default-features = false }
rv-asm             = { path = "rv-asm" }
wasm-bindgen       = "0.2"
serde              = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json         = "1"
tsify              = { version = "0.5.8", default-features = false, features = ["js"] }

# Measured: "s" + one codegen
# unit is the smallest build at full speed; "z" saves ~5 % gzipped but steps
# the cores 20–30 % slower.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
