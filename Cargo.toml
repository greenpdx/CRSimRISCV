[workspace]
members = ["rv-isa", "sim", "assembler-wasm"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
rv-isa             = { path = "rv-isa" }
wasm-bindgen       = "0.2"
serde              = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json         = "1"

[profile.release]
opt-level = "s"
lto = true
