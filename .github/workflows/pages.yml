# Build the visualizer (Rust → wasm, then Vite) and publish it on GitHub Pages:
# https://greenpdx.github.io/CRSimRISCV/
#
# Repo setting: Settings → Pages → Source = "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Build the wasm module
        run: npm run wasm
      - name: Rust tests
        run: cargo test --workspace
      - name: Type check and unit tests
        run: |
          npm run type-check
          npx vitest run
      - name: Build the site
        run: npm run build-only
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      # Pages serves 404.html for unknown paths: let the app load there too.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
